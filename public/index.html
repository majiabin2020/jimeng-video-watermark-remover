<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>即梦视频无水印解析</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container { width: 100%; max-width: 600px; padding: 40px 24px; }
    h1 {
      text-align: center; font-size: 28px; font-weight: 700; margin-bottom: 8px;
      background: linear-gradient(90deg, #a78bfa, #60a5fa);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .subtitle { text-align: center; font-size: 14px; color: #888; margin-bottom: 32px; }
    .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
    input[type="text"] {
      flex: 1; padding: 14px 18px; background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12); border-radius: 12px;
      color: #fff; font-size: 15px; outline: none;
    }
    input[type="text"]:focus { border-color: #a78bfa; }
    input[type="text"]::placeholder { color: #666; }
    button {
      padding: 14px 28px; background: linear-gradient(135deg, #a78bfa, #7c3aed);
      border: none; border-radius: 12px; color: #fff; font-size: 15px;
      font-weight: 600; cursor: pointer; transition: opacity 0.2s; white-space: nowrap;
    }
    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .result {
      display: none; background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px; padding: 24px; margin-top: 16px;
    }
    .result.show { display: block; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .video-header { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
    .video-cover { width: 72px; height: 72px; border-radius: 10px; object-fit: cover; background: #1a1a2e; flex-shrink: 0; }
    .video-meta { flex: 1; min-width: 0; }
    .video-title { font-size: 16px; font-weight: 600; color: #e2e8f0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .video-author { font-size: 13px; color: #888; margin-top: 4px; }
    .video-tags { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    .tag { font-size: 11px; padding: 3px 8px; border-radius: 6px; background: rgba(255,255,255,0.06); color: #999; }
    .tag.nowm { background: rgba(52,211,153,0.15); color: #34d399; }
    .tag.wm { background: rgba(251,191,36,0.15); color: #fbbf24; }
    .tag.res { background: rgba(96,165,250,0.15); color: #60a5fa; }
    .preview-container { margin-bottom: 16px; }
    video { width: 100%; max-height: 400px; border-radius: 12px; background: #000; }
    .result-label { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; margin-top: 12px; }
    .result-url {
      word-break: break-all; background: rgba(0,0,0,0.3); padding: 12px;
      border-radius: 8px; font-size: 13px; color: #a5b4fc; margin-bottom: 12px;
      max-height: 80px; overflow-y: auto; font-family: 'Consolas', monospace;
    }
    .btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
    .btn-sm { padding: 10px 20px; font-size: 13px; border-radius: 8px; }
    .btn-copy { background: linear-gradient(135deg, #34d399, #059669); }
    .btn-download { background: linear-gradient(135deg, #60a5fa, #2563eb); }
    .btn-download-nowm { background: linear-gradient(135deg, #34d399, #059669); }
    .error {
      display: none; background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3);
      border-radius: 12px; padding: 16px; margin-top: 16px; color: #fca5a5; font-size: 14px; line-height: 1.6;
    }
    .error.show { display: block; }
    .loading { display: none; text-align: center; padding: 20px; color: #888; }
    .loading.show { display: block; }
    .spinner {
      display: inline-block; width: 20px; height: 20px;
      border: 2px solid rgba(167,139,250,0.3); border-top-color: #a78bfa;
      border-radius: 50%; animation: spin 0.8s linear infinite;
      vertical-align: middle; margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #059669; color: #fff; padding: 10px 24px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity 0.3s; z-index: 100; }
    .toast.show { opacity: 1; }
    footer { text-align: center; margin-top: 32px; font-size: 12px; color: #555; }
    #loginBar { text-align: center; margin-bottom: 20px; }
    .btn-login { padding: 10px 20px; font-size: 13px; border-radius: 8px; background: linear-gradient(135deg,#f59e0b,#d97706); border: none; color: #fff; cursor: pointer; margin-left: 8px; }
    .btn-logout { padding: 10px 20px; font-size: 13px; border-radius: 8px; background: linear-gradient(135deg,#6b7280,#4b5563); border: none; color: #fff; cursor: pointer; margin-left: 8px; }
    .btn-login:disabled { opacity: 0.5; cursor: not-allowed; }
    .wm-info { background: rgba(251,191,36,0.1); border: 1px solid rgba(251,191,36,0.2); border-radius: 8px; padding: 10px 14px; margin-top: 12px; font-size: 13px; color: #fbbf24; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="container">
    <h1>即梦视频无水印解析</h1>
    <p class="subtitle">粘贴即梦视频分享链接，获取视频下载地址</p>

    <div id="loginBar">
      <span id="loginStatus">检查登录状态...</span>
      <button id="loginBtn" class="btn-login" style="display:none" onclick="doLogin()">扫码登录</button>
      <button id="logoutBtn" class="btn-logout" style="display:none" onclick="doLogout()">退出登录</button>
    </div>

    <div class="input-group">
      <input type="text" id="urlInput" placeholder="粘贴即梦视频分享链接..." />
      <button id="parseBtn" onclick="parse()">解析</button>
    </div>

    <div class="loading" id="loading"><span class="spinner"></span> 正在解析中...</div>
    <div class="error" id="error"></div>

    <div class="result" id="result">
      <div class="video-header">
        <img id="coverImg" class="video-cover" src="" alt="" style="display:none" />
        <div class="video-meta">
          <div class="video-title" id="videoTitle">即梦视频</div>
          <div class="video-author" id="videoAuthor"></div>
          <div class="video-tags" id="videoTags"></div>
        </div>
      </div>
      <div class="preview-container" id="previewContainer"></div>
      <div class="result-label" id="noWmLabel" style="display:none">无水印下载地址</div>
      <div class="result-url" id="noWmUrl" style="display:none"></div>
      <div class="btn-row">
        <button class="btn-sm btn-copy" id="copyNoWmBtn" style="display:none" onclick="copyNoWmUrl()">复制无水印链接</button>
        <button class="btn-sm btn-download" id="primaryDownloadBtn" onclick="downloadVideo(true)">下载无水印视频</button>
        <button class="btn-sm btn-download-nowm" id="dlNoWmBtn" style="display:none" onclick="downloadVideo(false)">下载原视频</button>
      </div>
      <div class="wm-info" id="wmInfo" style="display:none"></div>
    </div>

    <footer>仅供学习交流使用@微信公众号：马佳彬</footer>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    var currentData = null;
    var urlInput = document.getElementById('urlInput');

    urlInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') parse(); });

    function request(method, url, body) {
      return new Promise(function(resolve, reject) {
        var xhr = new XMLHttpRequest();
        xhr.open(method, url, true);
        if (body) xhr.setRequestHeader('Content-Type', 'application/json');
        xhr.timeout = 120000;
        xhr.onload = function() {
          try { resolve({ ok: xhr.status >= 200 && xhr.status < 300, data: JSON.parse(xhr.responseText), status: xhr.status }); }
          catch (e) { reject(new Error('JSON parse error')); }
        };
        xhr.onerror = function() { reject(new Error('网络请求失败')); };
        xhr.ontimeout = function() { reject(new Error('请求超时')); };
        xhr.send(body ? JSON.stringify(body) : null);
      });
    }

    function updateLoginUI(loggedIn) {
      var status = document.getElementById('loginStatus');
      var loginBtn = document.getElementById('loginBtn');
      var logoutBtn = document.getElementById('logoutBtn');
      if (loggedIn) {
        status.innerHTML = '<span style="color:#34d399">已登录</span>';
        loginBtn.style.display = 'none';
        logoutBtn.style.display = 'inline-block';
      } else {
        status.innerHTML = '<span style="color:#fbbf24">未登录</span> - <a href="javascript:doLogin()" style="color:#a78bfa">登录</a>后可获取更多信息';
        loginBtn.style.display = 'inline-block';
        logoutBtn.style.display = 'none';
      }
    }

    async function checkLogin() {
      try { var resp = await request('GET', '/api/login-status'); if (resp.ok) updateLoginUI(resp.data.loggedIn); } catch {}
    }
    checkLogin();

    async function doLogin() {
      var btn = document.getElementById('loginBtn');
      var status = document.getElementById('loginStatus');
      btn.disabled = true; btn.textContent = '登录中...';
      status.innerHTML = '<span class="spinner" style="width:14px;height:14px;"></span> 浏览器已打开，请扫码登录...';
      try {
        var resp = await request('POST', '/api/login');
        if (resp.ok && resp.data.success) { updateLoginUI(true); }
        else { updateLoginUI(false); throw new Error(resp.data.error || 'Login failed'); }
      } catch (e) { status.innerHTML = '<span style="color:#ef4444">登录失败: ' + e.message + '</span>'; updateLoginUI(false); }
      finally { btn.disabled = false; btn.textContent = '扫码登录'; }
    }

    async function doLogout() {
      try { await request('POST', '/api/logout'); updateLoginUI(false); } catch {}
    }

    function extractUrl(text) {
      var m = text.match(/https?:\/\/[^\s]*jimeng[^\s]*/i);
      return m ? m[0].replace(/[，。！？）》\]]+$/, '') : '';
    }

    async function parse() {
      var raw = urlInput.value.trim();
      if (!raw) { showError('请输入分享链接'); return; }
      var url = extractUrl(raw);
      if (!url) { showError('未找到即梦链接，请检查输入'); return; }

      hideAll(); showLoading(true);
      try {
        var resp = await request('POST', '/api/parse', { url: url });
        showLoading(false);
        if (!resp.ok || !resp.data.success) {
          var msg = resp.data?.error || '解析失败';
          if (msg.indexOf('登录') !== -1 || msg.indexOf('session') !== -1) { checkLogin(); }
          showError(msg);
          return;
        }
        currentData = resp.data;
        showResult(resp.data);
      } catch (e) {
        showLoading(false);
        showError('请求失败: ' + e.message);
      }
    }

    function showResult(data) {
      var result = document.getElementById('result');
      var coverImg = document.getElementById('coverImg');
      var titleEl = document.getElementById('videoTitle');
      var authorEl = document.getElementById('videoAuthor');
      var tagsEl = document.getElementById('videoTags');
      var preview = document.getElementById('previewContainer');
      var noWmLabel = document.getElementById('noWmLabel');
      var noWmUrl = document.getElementById('noWmUrl');
      var copyNoWmBtn = document.getElementById('copyNoWmBtn');
      var wmInfo = document.getElementById('wmInfo');
      var dlNoWmBtn = document.getElementById('dlNoWmBtn');
      var primaryDownloadBtn = document.getElementById('primaryDownloadBtn');

      // Cover
      if (data.coverUrl) { coverImg.src = data.coverUrl; coverImg.style.display = 'block'; }
      else { coverImg.style.display = 'none'; }

      // Title
      titleEl.textContent = data.title || '即梦视频';

      // Author
      authorEl.textContent = data.author ? '@' + data.author : '';

      // Tags
      var tagsHtml = '';
      if (data.watermarkType === 1 && data.watermarkDuration > 0) {
        tagsHtml += '<span class="tag wm">尾部水印 ' + data.watermarkDuration.toFixed(1) + 's</span>';
      } else if (data.watermarkType === 0 || data.watermarkType === undefined) {
        tagsHtml += '<span class="tag nowm">无水印</span>';
      }
      if (data.width && data.height) tagsHtml += '<span class="tag res">' + data.width + 'x' + data.height + '</span>';
      if (data.fps) tagsHtml += '<span class="tag">' + data.fps + 'fps</span>';
      tagsHtml += '<span class="tag">MP4</span>';
      tagsEl.innerHTML = tagsHtml;

      // No-watermark URL
      if (data.noWatermarkDownloadUrl && (data.watermarkDuration > 0 || data.watermarkType === 1 || (data.altVideoUrl && data.altVideoUrl !== data.videoUrl))) {
        noWmLabel.style.display = 'block';
        noWmUrl.style.display = 'block';
        noWmUrl.textContent = location.origin + data.noWatermarkDownloadUrl;
        copyNoWmBtn.style.display = 'inline-block';
        dlNoWmBtn.style.display = 'inline-block';
        primaryDownloadBtn.textContent = '下载无水印视频';
      } else {
        noWmLabel.style.display = 'none';
        noWmUrl.style.display = 'none';
        copyNoWmBtn.style.display = 'none';
        dlNoWmBtn.style.display = 'none';
        primaryDownloadBtn.textContent = '下载视频';
      }

      // Preview and download use downloadUrl (more reliable CDN URL)
      var dlUrl = data.downloadUrl || data.videoUrl;
      var proxyUrl = '/api/download?url=' + encodeURIComponent(dlUrl);
      var fileName = (data.title || 'jimeng_video').replace(/[\\/:*?"<>|]/g, '_') + '.mp4';
      proxyUrl += '&name=' + encodeURIComponent(fileName);
      preview.innerHTML = '<video controls preload="metadata" src="' + proxyUrl + '"></video>';

      // Watermark info and no-watermark download
      if (data.watermarkType === 1 && data.watermarkDuration > 0) {
        var dur = data.videoDuration || data.totalDuration;
        wmInfo.innerHTML = '该视频含 <b>' + data.watermarkDuration.toFixed(1) + '秒</b> 尾部水印（即梦logo）。'
          + '点击"无水印下载"可自动裁剪掉尾部水印，保留前 ' + dur.toFixed(1) + ' 秒纯净内容。';
        wmInfo.style.display = 'block';
        dlNoWmBtn.style.display = 'inline-block';
      } else {
        wmInfo.style.display = 'none';
        dlNoWmBtn.style.display = 'none';
      }

      result.classList.add('show');
    }

    function showError(msg) { var el = document.getElementById('error'); el.textContent = msg; el.classList.add('show'); }
    function showLoading(show) { document.getElementById('loading').classList.toggle('show', show); document.getElementById('parseBtn').disabled = show; }
    function hideAll() { document.getElementById('result').classList.remove('show'); document.getElementById('error').classList.remove('show'); }

    async function copyUrl() {
      var text = currentData ? currentData.videoUrl : '';
      try { await navigator.clipboard.writeText(text); showToast('已复制视频直链'); }
      catch { var ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); showToast('已复制视频直链'); }
    }

    async function copyNoWmUrl() {
      var text = currentData ? (location.origin + currentData.noWatermarkDownloadUrl) : '';
      try { await navigator.clipboard.writeText(text); showToast('已复制无水印链接'); }
      catch { var ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); showToast('已复制无水印链接'); }
    }

    function downloadVideo(noWatermark) {
      if (!currentData) return;
      var a = document.createElement('a');
      var fileName = (currentData.title || 'jimeng_video').replace(/[\\/:*?"<>|]/g, '_');
      var rawUrl = currentData.downloadUrl || currentData.videoUrl;
      var noWmUrl = currentData.noWatermarkDownloadUrl;
      var hasNoWm = !!(noWmUrl && (currentData.watermarkDuration > 0 || currentData.watermarkType === 1 || (currentData.altVideoUrl && currentData.altVideoUrl !== currentData.videoUrl)));

      if (noWatermark && hasNoWm) {
        a.href = noWmUrl;
        a.download = fileName + '_no_wm.mp4';
      } else {
        var proxyUrl = '/api/download?url=' + encodeURIComponent(rawUrl);
        proxyUrl += '&name=' + encodeURIComponent(fileName + '.mp4');
        a.href = proxyUrl;
        a.download = fileName + '.mp4';
      }

      a.target = '_blank';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    function showToast(msg) {
      var el = document.getElementById('toast'); el.textContent = msg; el.classList.add('show');
      setTimeout(function() { el.classList.remove('show'); }, 2000);
    }
  </script>
</body>
</html>
